# LAB ONLY: intentionally vulnerable PHP (PHP2Shell, CVE-2026-109618 / CVE-2026-109619, fixed in 8.4.27)
# used to generate Sysdig findings for remediation testing. Working public exploits exist.
# Network-isolated: PHP listens on 127.0.0.1 only, no Service, no Route, all egress denied.
# The namespace-wide allow-same-namespace policies make NetworkPolicy ingress rules ineffective, so loopback binding is the real control.
apiVersion: template.openshift.io/v1
kind: Template
parameters:
  - name: NAMESPACE
    value: c9ba43-dev
objects:
  - apiVersion: v1
    kind: ConfigMap
    metadata:
      name: vuln-lab-php-app
      namespace: ${NAMESPACE}
      labels:
        app: vuln-lab
    data:
      index.php: |
        <?php echo "vuln-lab php " . PHP_VERSION . "\n";
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: vuln-lab
      namespace: ${NAMESPACE}
      labels:
        app: vuln-lab
        purpose: sysdig-remediation-lab
    spec:
      replicas: 1
      selector:
        matchLabels:
          app: vuln-lab
      template:
        metadata:
          labels:
            app: vuln-lab
            purpose: sysdig-remediation-lab
        spec:
          automountServiceAccountToken: false
          containers:
            - name: web
              image: docker.io/library/php:8.4.26-cli
              command: ["php", "-S", "127.0.0.1:8080", "-t", "/app"]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
                runAsNonRoot: true
                seccompProfile:
                  type: RuntimeDefault
              volumeMounts:
                - name: app
                  mountPath: /app
                  readOnly: true
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  cpu: 200m
                  memory: 128Mi
          volumes:
            - name: app
              configMap:
                name: vuln-lab-php-app
  - apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: vuln-lab-labelled-clients-only
      namespace: ${NAMESPACE}
    spec:
      podSelector:
        matchLabels:
          app: vuln-lab
      policyTypes: ["Ingress", "Egress"]
      ingress:
        - from:
            - podSelector:
                matchLabels:
                  vuln-lab-client: "true"
      egress: []
