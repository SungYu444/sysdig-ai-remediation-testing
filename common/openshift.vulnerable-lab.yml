# LAB ONLY: intentionally outdated image to generate Sysdig findings for remediation testing.
# Internal only: ClusterIP service, no Route, ingress limited to the same namespace.
apiVersion: template.openshift.io/v1
kind: Template
parameters:
  - name: NAMESPACE
    value: c9ba43-dev
objects:
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: vuln-lab
      namespace: ${NAMESPACE}
      labels:
        app: vuln-lab
        purpose: sysdig-remediation-lab
    spec:
      replicas: 1
      selector:
        matchLabels:
          app: vuln-lab
      template:
        metadata:
          labels:
            app: vuln-lab
            purpose: sysdig-remediation-lab
        spec:
          automountServiceAccountToken: false
          containers:
            - name: web
              image: docker.io/nginxinc/nginx-unprivileged:1.16.0
              ports:
                - containerPort: 8080
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
                runAsNonRoot: true
                seccompProfile:
                  type: RuntimeDefault
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  cpu: 100m
                  memory: 128Mi
  - apiVersion: v1
    kind: Service
    metadata:
      name: vuln-lab
      namespace: ${NAMESPACE}
    spec:
      type: ClusterIP
      selector:
        app: vuln-lab
      ports:
        - port: 8080
          targetPort: 8080
  - apiVersion: networking.k8s.io/v1
    kind: NetworkPolicy
    metadata:
      name: vuln-lab-same-namespace-only
      namespace: ${NAMESPACE}
    spec:
      podSelector:
        matchLabels:
          app: vuln-lab
      policyTypes: ["Ingress", "Egress"]
      ingress:
        - from:
            - podSelector: {}
      egress: []
